services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
  db:
    ports:
      - "5432:5432"
    image: postgres:18-alpine
    restart: always
    environment: 
      POSTGRES_USER: foo
      POSTGRES_PASSWORD: bar
      POSTGRES_DB: foo
    volumes:
      - ./database/:/docker-entrypoint-initdb.d/