plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    implementation 'org.eclipse.jetty:jetty-server:12.1.14'
    implementation 'org.eclipse.jetty.ee8:jetty-ee8-servlet:12.1.4'
}

jar {
    manifest {
        attributes "Main-Class": "uk.ac.ic.doc.g0727127.App"
    }

    // Required in Gradle 7+ to prevent build failures from duplicate files
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        // configurations.compile is removed; runtimeClasspath includes everything needed
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
